schema_version: 1

context:
  name: pyrsr
  version: "0.8.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pyrsr-${{ version }}.tar.gz
  sha256: bdb023a4aca50476db66561c65fc94f7e572df1b091736e784ce06d6a97a55ad

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
    - setuptools-git
  run:
    - matplotlib-base
    - numpy
    - pandas
    - python >=${{ python_min }}
    - scipy

tests:
  - python:
      imports:
        - pyrsr
        - pyrsr.rsr
        - pyrsr.sensorspecs
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A package providing relative spectral response functions for remote sensing instruments.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://git.gfz-potsdam.de/geomultisens/pyrsr

extra:
  recipe-maintainers:
    - danschef
